<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hill Valley Paradox</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; display: block; }
      #hv-debug {
        position: fixed; top: 0; right: 0; width: 280px; max-height: 100%; overflow: auto;
        background: rgba(10, 12, 20, 0.92); color: #d8e0ec; font: 12px/1.4 Consolas, monospace;
        padding: 8px; box-sizing: border-box; z-index: 10;
      }
      #hv-debug h3 { margin: 8px 0 4px; font-size: 12px; color: #f4d35e; }
      #hv-debug select, #hv-debug button { font: inherit; margin: 2px 2px 2px 0; }
      #hv-debug .flag { cursor: pointer; display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
